    name: Florida Bay
    csv_root: Florida Bay/Predictions_1
    s2_root: Florida Bay/Sentinel-2/Final
    cudem: Florida Bay/Cudem/Florida_Bay_cudem.tif
    proposed_suffix: Proposed_method
